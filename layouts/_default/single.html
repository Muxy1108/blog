{{ define "main" }}
{{ if eq .Type "blog" }}{{ if not .Params.menu }}
<h1>{{ .Title }}</h1>

<p class="post-meta">
  <time datetime="{{ .Date.Format "2006-01-02" }}">
    {{ .Date.Format (default "2006-01-02" .Site.Params.dateFormat) }}
  </time>

  {{ with .Params.location }}
    <span class="post-location">
      · 于 {{ . }}
    </span>
  {{ end }}
</p>

{{ end }}{{ end }}
<content>
  {{ .Content }}
</content>

{{- partial "post_footer.html" . -}}
{{ end }}
